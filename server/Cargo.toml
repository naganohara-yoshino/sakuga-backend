[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
chrono = "0.4"
pgvector = "0.4"
dotenvy = "0.15"
config = "0.15"
mimalloc = { version = "0.1", features = ["v3"] }
opendal = { version = "0.55", features = ["services-s3"] }

[dependencies.sea-orm]
version = "2.0.0-rc.36"
features = ["debug-print", "runtime-tokio-rustls", "sqlx-postgres", "pgvector"]

[dependencies.salvo]
version = "0.89"
features = ["anyhow", "affix-state", "tower-compat", "oapi"]

[dependencies.redis]
version = "1.0"
features = ["tokio-comp", "connection-manager"]
